name: Spam Detection CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('stopwords'); nltk.download('wordnet'); nltk.download('omw-1.4')"

      - name: Run unit tests
        run: pytest tests/ -q

  build-and-push:
    name: Build & Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spam-detection:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spam-detection:latest

  deploy:
    name: Continuous Deployment
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spam-detection:latest

      - name: Run container
        run: |
          $ErrorActionPreference = "Continue"
          docker rm -f spam-detection *> $null
          docker run -d --name spam-detection -p 8080:8080 `
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-detection:latest
